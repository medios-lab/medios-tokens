name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Vet, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # The module has no dependencies and no go.sum for the cache to key on.
          cache: false

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 -v ./...

      - name: Build
        run: go build ./...
